version: 2
updates:
  # Runtime deps (@googleapis/*, google-auth-library, MCP SDK) and devDeps live
  # in the single root manifest.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Blocked upstream: release-notes-generator still uses
      # conventional-changelog-writer@8, which renders empty changelog
      # sections under the v10 preset. See issue #66.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # Blocked upstream: googleapis-common exact-pins this package; any
      # newer root copy forks the tree and breaks the build. See issue #70.
      - dependency-name: google-auth-library

  # SHA-pinned actions need automated bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
