version: 2
updates:
  # Runtime deps (googleapis, google-auth-library, MCP SDK) live in the
  # workspace manifests; the glob covers root plus every package and service.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
      - "/services/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"

  # SHA-pinned actions need automated bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
