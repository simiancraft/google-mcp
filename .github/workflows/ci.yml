name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: '1.1.34'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      # Build before typecheck: dependent workspaces typecheck against the
      # built dist of their workspace dependencies.
      - name: Build
        run: bun run build

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Test (with coverage gate)
        run: bun test --coverage

      - name: Dead code (knip)
        run: bun run check:knip
